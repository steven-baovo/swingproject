name: Update market report
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1-5"
permissions:
  contents: write
concurrency:
  group: market-report
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check report safeguards
        run: python -m unittest discover -s tests -v
      - name: Download and validate market data
        run: python scripts/check_market.py
      - name: Build report
        run: python scripts/build_report.py --only-new-session
      - name: Update economic headlines
        continue-on-error: true
        run: python scripts/fetch_news.py
      - name: Save successful report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- web/vn30.json; then
            git add web/data web/vn30.json web/reports
          fi
          git add web/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily market report"
            git push
          fi
